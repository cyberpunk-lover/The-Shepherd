# Pubblica il sito dei giocatori su GitHub Pages a ogni push su main.
# Usa solo public/ e i blocchi già cifrati in cifrato/: i dati segreti non passano mai di qui.
name: Pubblica il sito

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  pubblica:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Prepara il sito
        run: node lib/assembla.js _site

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Pubblica su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
